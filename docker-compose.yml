services:
  db:
    image: postgres:16-alpine
    container_name: rb-db
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: rb
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d rb || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  ml:
    build: ./ml
    container_name: rb-ml
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    restart: unless-stopped

  api:
    build: ./api
    container_name: rb-api
    depends_on:
      db:
        condition: service_healthy
      ml:
        condition: service_started
    environment:
      PORT: "8080"
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: app
      DB_PASS: app
      DB_NAME: rb
      JWT_SECRET: change_me
      JWT_ISS: rb-app
      JWT_AUD: rb-users
      JWT_EXP: 15m
      ML_URL: http://ml:8000
      # Cookies dev-friendly (em prod, mude para NODE_ENV=production e remova COOKIE_SECURE)
      NODE_ENV: development
      COOKIE_SECURE: "false"
      # Não defina COOKIE_DOMAIN em dev; em prod, defina para seu domínio
    ports:
      - "8080:8080"
    restart: unless-stopped

volumes:
  db-data:
